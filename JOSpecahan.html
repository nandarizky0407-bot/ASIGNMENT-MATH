<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serbu Pecahan! — Latihan Olimpiade Matematika SD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Plus+Jakarta+Sans:wght@400..800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5EFE2; --card:#FFFCF3; --ink:#2B2420; --ink-soft:rgba(43,36,32,.6);
  --acc:#D14B2C; --green:#1F6E46; --amber:#E9A63B; --amber-soft:#F6D48C;
  --line:rgba(43,36,32,.16);
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(rgba(43,36,32,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(43,36,32,.05) 1px, transparent 1px);
  background-size:28px 28px;
  min-height:100vh;
}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit}
b{font-weight:800}
.mono{font-family:var(--mono)}
.ok{color:var(--green)} .bad{color:var(--acc)} .miss{color:#8a6a1f}

.ic{width:1.05em;height:1.05em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}

.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.12;margin:0 .2em;font-weight:700;text-align:center}
.fr>.n{padding:0 .32em;border-bottom:2.5px solid currentColor}
.fr>.d{padding:0 .32em}
.mx{white-space:nowrap}
.mx>.w{margin-right:.14em;font-weight:700}
.cfr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .3em;line-height:1.4;font-weight:700;text-align:center}
.cfr>.ct{padding:0 .45em .1em;border-bottom:3px solid currentColor}
.cfr>.cb{padding:.1em .45em 0}

#topbar{position:fixed;inset:0 0 auto 0;height:64px;z-index:50;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:rgba(245,239,226,.94);backdrop-filter:blur(5px);border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:38px;height:38px;background:var(--ink);color:var(--paper);border-radius:11px;display:grid;place-items:center;
  font-family:Fraunces,serif;font-weight:900;font-size:1.3rem;transform:rotate(-6deg)}
.brand span{font-family:Fraunces,serif;font-weight:900;letter-spacing:.06em;font-size:.95rem}
.who{font-size:.8rem;color:var(--ink-soft);font-weight:600;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who b{color:var(--ink)}
#dots{display:flex;gap:3px;margin:0 auto;flex-wrap:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:transparent;border:2px solid rgba(43,36,32,.3);cursor:pointer;transition:.2s}
.dot.c{background:var(--green);border-color:var(--green)}
.dot.w{background:var(--acc);border-color:var(--acc)}
.dot.s{background:var(--amber);border-color:var(--amber)}
.dot.cur{border-color:var(--ink);background:var(--ink);transform:scale(1.25)}
#timerWrap{position:relative;display:flex;align-items:center;gap:10px}
#timerBox{position:relative;width:54px;height:54px}
#timerBox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:5}
#ring{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-dasharray:163.4;transition:stroke-dashoffset .25s linear,stroke .3s}
#timeTxt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:.8rem}
#timerBox.idle{opacity:.35}
#timerBox.done{opacity:.6}
#timerBox.done #ring{stroke:var(--green)}
#timerBox.low #ring{stroke:var(--acc)}
#timerBox.low #timeTxt{color:var(--acc);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.mini{border:2px solid var(--ink);border-radius:999px;padding:7px 12px;font-weight:800;font-size:.75rem;
  background:var(--amber-soft);cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:.15s;white-space:nowrap}
.mini:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.mini:disabled{opacity:.4;cursor:default;box-shadow:none}
.p15{position:absolute;right:-4px;top:-16px;font-family:var(--mono);font-weight:700;color:var(--green);animation:pup .9s forwards;pointer-events:none}
@keyframes pup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-26px)}}
.navb{display:flex;align-items:center;gap:6px;height:42px;padding:0 12px;border:2px solid var(--ink);border-radius:12px;
  background:var(--card);cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:.15s;font-weight:800;font-size:.85rem}
.navb .ic{width:1.2em;height:1.2em}
.navb:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.navb:active:not(:disabled){transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.navb:disabled{opacity:.35;cursor:default;box-shadow:none}
#navWrap{display:flex;gap:8px;align-items:center}
.hide{visibility:hidden}

#stage{max-width:1100px;margin:0 auto;padding:92px 22px 64px}
.slide{animation:rise .5s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.kick{font-family:var(--mono);font-size:.75rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}

.cover{display:grid;grid-template-columns:1.1fr .9fr;gap:52px;align-items:center;min-height:calc(100vh - 180px)}
.cover h1{font-family:Fraunces,serif;font-weight:900;font-size:clamp(3rem,7vw,5.4rem);line-height:.98;margin:16px 0 18px;letter-spacing:-.01em}
.cover h1 mark{background:var(--amber-soft);padding:0 .14em;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cover .desc{font-size:1.06rem;line-height:1.85;color:rgba(43,36,32,.82);max-width:52ch}
.c-info{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:26px;font-weight:700;font-size:.88rem}
.c-info span{display:flex;align-items:center;gap:7px}
.c-info .ic{color:var(--acc)}
.pcard{position:relative;transform:rotate(1.4deg)}
.pcard .card-body{background:var(--card);border:2.5px solid var(--ink);border-radius:18px;box-shadow:9px 9px 0 var(--ink);padding:32px 32px 30px}
.tape{position:absolute;top:-15px;left:50%;transform:translateX(-50%) rotate(-3deg);width:140px;height:30px;
  background:rgba(233,166,59,.6);border-left:2px dashed rgba(43,36,32,.25);border-right:2px dashed rgba(43,36,32,.25);z-index:2}
.ptitle{font-family:var(--mono);font-weight:700;letter-spacing:.22em;font-size:.78rem;margin-bottom:20px;padding-bottom:12px;border-bottom:2px dashed var(--line)}
.plabel{display:block;font-size:.8rem;font-weight:700;color:var(--ink-soft);margin-bottom:4px}
#nameInput{width:100%;border:0;border-bottom:3px solid var(--ink);background:transparent;font-family:Fraunces,serif;
  font-size:1.55rem;font-weight:600;padding:6px 2px;outline:none;color:var(--ink)}
#nameInput:focus{border-color:var(--acc)}
#nameInput::placeholder{color:rgba(43,36,32,.3)}
.err{color:var(--acc);font-weight:700;font-size:.85rem;min-height:1.3em;margin-top:6px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.plist{list-style:none;margin:14px 0 24px;display:grid;gap:10px}
.plist li{display:flex;gap:10px;font-size:.88rem;line-height:1.55;align-items:flex-start}
.plist .ic{margin-top:3px;color:var(--green)}

.btn{display:inline-flex;align-items:center;gap:10px;font-weight:800;border:2.5px solid var(--ink);border-radius:13px;
  padding:.85em 1.6em;background:var(--card);cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:.15s;font-size:.95rem}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:2px 2px 0 var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.acc{background:var(--acc);color:#fff}
.btn.big{font-size:1.05rem;padding:1em 1.9em}

.bekal{max-width:840px;margin:0 auto;padding-top:20px}
.bekal h2{font-family:Fraunces,serif;font-weight:900;font-size:clamp(2rem,4vw,2.8rem);margin:10px 0 8px}
.rules{margin-top:16px}
.rule{display:grid;grid-template-columns:76px 1fr;gap:20px;padding:24px 0;border-bottom:2px dashed var(--line);align-items:start}
.rule:last-of-type{border-bottom:0}
.rule .no{font-family:Fraunces,serif;font-weight:900;font-size:52px;line-height:1;color:var(--ink)}
@supports (-webkit-text-stroke:2px black){
  .rule .no,.q-no,.dnum{color:transparent;-webkit-text-stroke:2.5px var(--ink)}
  .dnum{-webkit-text-stroke:3px var(--ink)}
}
.rule h3{font-family:Fraunces,serif;font-weight:800;font-size:1.28rem;margin-bottom:5px}
.rule p{font-size:.95rem;line-height:1.7;color:rgba(43,36,32,.8)}
.ex{display:inline-block;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:9px 16px;margin-top:10px;
  font-family:Fraunces,serif;font-weight:600;font-size:1.05rem;box-shadow:3px 3px 0 rgba(43,36,32,.15)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:6px 14px;background:var(--card);font-family:Fraunces,serif;font-weight:600;font-size:.98rem;box-shadow:2px 2px 0 rgba(43,36,32,.15)}
.center{text-align:center;margin-top:26px}

.divider{min-height:calc(100vh - 190px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.dnum{font-family:Fraunces,serif;font-weight:900;font-size:clamp(90px,15vw,168px);line-height:1;color:var(--ink)}
.divider h2{font-family:Fraunces,serif;font-weight:900;font-size:clamp(2rem,4.5vw,3rem)}
.divider p{max-width:60ch;line-height:1.85;color:rgba(43,36,32,.82);font-size:1.02rem}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 20px}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:3px 13px;font-size:.8rem;font-weight:800;background:var(--card)}

.qgrid{display:grid;grid-template-columns:250px 1fr;gap:40px;align-items:start}
.qside{position:sticky;top:88px;display:grid;gap:8px}
.rlabel{font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.16em;color:var(--ink-soft)}
.q-no{font-family:Fraunces,serif;font-weight:900;font-size:clamp(70px,9vw,112px);line-height:.9;color:var(--ink)}
.q-pos{font-weight:800;font-size:.92rem}
.q-tag{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--ink);border-radius:999px;padding:5px 13px;
  font-size:.78rem;font-weight:800;background:var(--amber-soft);width:fit-content;margin-top:4px}
.q-status{font-weight:800;font-size:.9rem;display:flex;align-items:center;gap:7px}
.qcard{position:relative;background:var(--card);border:2.5px solid var(--ink);border-radius:20px;box-shadow:9px 9px 0 var(--ink);padding:32px 36px 30px}
.q-text{font-family:Fraunces,serif;font-weight:600;font-size:clamp(1.25rem,2.2vw,1.6rem);line-height:2;padding-bottom:20px;border-bottom:2px dashed var(--line)}
.opts{display:grid;gap:12px;margin-top:22px}
.opt{display:flex;align-items:center;gap:15px;width:100%;text-align:left;padding:11px 16px;border:2px solid rgba(43,36,32,.3);
  border-radius:13px;background:transparent;cursor:pointer;font-family:Fraunces,serif;font-weight:600;font-size:1.1rem;transition:.15s}
.opt:not(:disabled):hover{border-color:var(--ink);background:rgba(43,36,32,.045);transform:translateX(5px)}
.opt .key{width:34px;height:34px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-family:'Plus Jakarta Sans';font-size:.9rem;background:var(--card);flex:none}
.opt.picked{border-color:var(--ink);background:#FFF3D3;box-shadow:3px 3px 0 var(--ink)}
.opt.picked .key{background:var(--ink);color:var(--paper)}
.opt.right{border-color:var(--green);background:#E9F3EB}
.opt.right .key{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrongpick{border-color:var(--acc);background:#FBE9E3}
.opt.wrongpick .key{background:var(--acc);border-color:var(--acc);color:#fff}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.qfoot{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:24px}
.hint{font-size:.82rem;color:var(--ink-soft);font-weight:600}
.stamp{position:absolute;top:16px;right:22px;transform:rotate(7deg);font-family:Fraunces,serif;font-weight:900;
  letter-spacing:.1em;font-size:1.15rem;border:3px solid;border-radius:10px;padding:.25em .65em;
  animation:stamp .5s cubic-bezier(.2,1.5,.4,1);z-index:3;background:var(--card)}
@keyframes stamp{0%{transform:rotate(24deg) scale(2.4);opacity:0}55%{opacity:1}100%{transform:rotate(7deg) scale(1)}}
.stamp.ok{color:var(--green);border-color:var(--green);background:#E9F3EB}
.stamp.bad{color:var(--acc);border-color:var(--acc);background:#FBE9E3}
.stamp.miss{color:#8a6a1f;border-color:#8a6a1f;background:#F9F0D8}
.explain{margin-top:22px;border:2px solid var(--ink);border-left-width:10px;border-radius:14px;background:#FBF6E8;padding:18px 22px;animation:rise .45s ease}
.explain.ok{border-left-color:var(--green)}
.explain.bad{border-left-color:var(--acc)}
.explain.miss{border-left-color:var(--amber)}
.explain h4{display:flex;gap:9px;align-items:center;font-family:Fraunces,serif;font-size:1.06rem;margin-bottom:10px}
.exbody{font-size:.98rem;line-height:2.1;color:rgba(43,36,32,.9)}

.report{position:relative;background:var(--card);border:2.5px solid var(--ink);border-radius:20px;box-shadow:10px 10px 0 var(--ink);
  padding:38px 42px;max-width:880px;margin:0 auto}
.vstamp{position:absolute;top:28px;right:32px;transform:rotate(7deg);font-family:Fraunces,serif;font-weight:900;letter-spacing:.08em;
  font-size:1.3rem;border:3px solid;border-radius:12px;padding:.3em .75em;animation:stamp .6s .2s cubic-bezier(.2,1.5,.4,1) both}
.vstamp.ok{color:var(--green);border-color:var(--green);background:#E9F3EB}
.vstamp.mid{color:#8a6a1f;border-color:var(--amber);background:#F9F0D8}
.vstamp.bad{color:var(--acc);border-color:var(--acc);background:#FBE9E3}
.rname{font-family:Fraunces,serif;font-weight:900;font-size:clamp(1.7rem,3.5vw,2.4rem);margin:8px 0 24px}
.score-row{display:flex;gap:44px;align-items:center;flex-wrap:wrap;border-bottom:2px dashed var(--line);padding-bottom:26px;margin-bottom:24px}
.big-score{font-family:Fraunces,serif;font-weight:900;font-size:clamp(84px,12vw,124px);line-height:.85}
.big-score small{display:block;font-family:'Plus Jakarta Sans';font-weight:700;font-size:.95rem;line-height:1.5;margin-top:12px;color:rgba(43,36,32,.75)}
.ledger{list-style:none;flex:1;min-width:270px;font-size:.98rem}
.ledger li{display:flex;align-items:baseline;gap:12px;padding:8px 0;font-weight:700}
.ledger .fill{flex:1;border-bottom:2px dotted rgba(43,36,32,.35);transform:translateY(-4px)}
.ledger b{font-size:1.1rem}
.sec-row{display:grid;grid-template-columns:170px 1fr 58px;gap:14px;align-items:center;margin:12px 0;font-weight:700;font-size:.9rem}
.track{height:18px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.fillb{display:block;height:100%;background:var(--green);border-radius:999px;animation:grow .8s cubic-bezier(.22,1,.36,1)}
@keyframes grow{from{width:0!important}}
.fillb.mid{background:var(--amber)}
.fillb.bad{background:var(--acc)}
.analysis{border-left:10px solid var(--amber);background:#FBF6E8;border-radius:0 14px 14px 0;padding:20px 26px;margin:26px 0}
.analysis h4{display:flex;gap:9px;align-items:center;font-family:Fraunces,serif;font-size:1.15rem;margin-bottom:12px}
.analysis p{font-size:.97rem;line-height:1.9;margin-bottom:10px}
.analysis p:last-child{margin-bottom:0}
.recapwrap{margin-top:8px}
.rh2{font-family:var(--mono);font-size:.75rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px}
.recap{display:flex;gap:34px;flex-wrap:wrap}
.rcol .rh{font-weight:800;font-size:.82rem;margin-bottom:8px}
.cells{display:flex;gap:6px;flex-wrap:wrap;max-width:560px}
.cell{width:22px;height:22px;border-radius:7px;border:2px solid rgba(43,36,32,.3)}
.cell.c{background:var(--green);border-color:var(--green)}
.cell.w{background:var(--acc);border-color:var(--acc)}
.cell.s{background:var(--amber);border-color:var(--amber)}
.legend{display:flex;gap:20px;margin-top:14px;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.legend span{display:flex;align-items:center;gap:7px}
.sw{width:13px;height:13px;border-radius:4px;display:inline-block}
.sw.c{background:var(--green)} .sw.w{background:var(--acc)} .sw.s{background:var(--amber)}
.rbtns{text-align:center;margin-top:32px}

@media(max-width:920px){
  .qgrid{grid-template-columns:1fr;gap:18px}
  .qside{position:static;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .q-no{font-size:54px}
  #dots,.who,#brandTxt{display:none}
  .cover{grid-template-columns:1fr;gap:34px;min-height:0;padding-top:10px}
  .report{padding:28px 22px}
  .vstamp{position:static;display:inline-block;transform:rotate(-3deg);margin-bottom:14px}
  .sec-row{grid-template-columns:110px 1fr 50px}
  .rule{grid-template-columns:52px 1fr;gap:14px}
  .rule .no{font-size:38px}
}
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-cl" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></symbol>
  <symbol id="i-cr" viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2.2"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4m0 1h12l-3 4 3 4H5"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-2-1.6-5-1.6-8-1v13c3-.6 6-.6 8 1 2-1.6 5-1.6 8-1V5c-3-.6-6-.6-8 1zm0 0v13"/></symbol>
  <symbol id="i-rt" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></symbol>
</svg>

<header id="topbar">
  <div class="brand"><div class="logo">&divide;</div><span id="brandTxt">SERBU PECAHAN</span></div>
  <div class="who">Peserta: <b id="stName">—</b></div>
  <div id="dots"></div>
  <div id="timerWrap">
    <div id="timerBox" class="idle">
      <svg viewBox="0 0 60 60"><circle class="ring-bg" cx="30" cy="30" r="26"/><circle id="ring" cx="30" cy="30" r="26"/></svg>
      <span id="timeTxt">3:00</span>
    </div>
    <button id="addBtn" class="mini" disabled>+15 dtk</button>
  </div>
  <div id="navWrap" class="hide">
    <button class="navb" id="prevBtn" title="Sebelumnya"><svg class="ic"><use href="#i-cl"/></svg></button>
    <button class="navb" id="nextBtn" title="Pindah tanpa menekan Cek Jawaban akan dihitung tidak dijawab"><span id="nextLbl">Lanjut</span><svg class="ic"><use href="#i-cr"/></svg></button>
  </div>
</header>

<main id="stage"></main>

<script>
/* =========================================================
   UTILITAS
========================================================= */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fr = (a,b) => `<span class="fr"><span class="n">${a}</span><span class="d">${b}</span></span>`;

/* =========================================================
   STATE & PEMETAAN SLIDE
   0 cover · 1-4 materi · 5/16/27 pembatas
   6-15 P1 · 17-26 P2 · 28-47 P3 · 48 hasil
========================================================= */
const SEC_N = [10,10,20];
const TOTAL = Q.length;      // 40
const LAST  = TOTAL + 8;     // 48
function freshState(){
  return { name:'', idx:0, qs:Q.map(()=>({picked:null, result:null, timeUsed:null})) };
}
let state = freshState();
const timer = { int:null, deadline:0, startedAt:0 };

function slideToQ(i){
  if(i>=6&&i<=15)  return i-6;
  if(i>=17&&i<=26) return i-7;
  if(i>=28&&i<=47) return i-8;
  return null;
}
function qToSlide(qi){ return qi<10 ? 6+qi : qi<20 ? 17+(qi-10) : 28+(qi-20); }

/* =========================================================
   TIMER
========================================================= */
function startTimer(){
  stopTimer();
  timer.startedAt = Date.now();
  timer.deadline  = timer.startedAt + DUR*1000;
  timer.int = setInterval(tick, 200);
  tick();
}
function stopTimer(){ if(timer.int){ clearInterval(timer.int); timer.int = null; } $('#addBtn').disabled = true; }
function tick(){
  const cq = slideToQ(state.idx);
  if(cq == null) return;
  const rem = timer.deadline - Date.now();
  if(rem <= 0){
    if(state.qs[cq].result == null){ finalize(cq,'timeout'); render(); }
    return;
  }
  $('#timeTxt').textContent = fmt(Math.ceil(rem/1000));
  const frac = Math.min(1, rem/(DUR*1000));
  $('#ring').style.strokeDashoffset = 163.4 * (1 - frac);
  $('#timerBox').classList.toggle('low', rem <= 30000);
}

/* =========================================================
   LOGIKA JAWABAN
========================================================= */
function finalize(qi, kind, silent){
  stopTimer();
  const st = state.qs[qi];
  if(st.result != null) return;
  st.timeUsed = Math.max(1, Math.round((Date.now() - timer.startedAt)/1000));
  st.result = kind === 'check' ? (st.picked === Q[qi].a ? 'correct' : 'wrong') : kind;
  if(!silent) render();
}
function onPick(qi, k, btn){
  if(state.qs[qi].result != null) return;
  state.qs[qi].picked = k;
  document.querySelectorAll('#stage .opt').forEach(x => x.classList.toggle('picked', x === btn));
  const cb = $('#checkBtn'); if(cb) cb.disabled = false;
}

/* =========================================================
   NAVIGASI
========================================================= */
function go(i){
  const cq = slideToQ(state.idx);
  if(cq != null && state.qs[cq].result == null) finalize(cq, 'skip', true);
  stopTimer();
  state.idx = i;
  window.scrollTo({top:0});
  render();
}
function next(){ if(state.idx < LAST) go(state.idx + 1); }
function prev(){ if(state.idx > 0) go(state.idx - 1); }

function questionHTML(qi){
  const q = Q[qi], st = state.qs[qi], sec = SECTIONS[q.sec];
  const pos = qi >= 20 ? qi-20+1 : qi >= 10 ? qi-10+1 : qi+1;
  const done = st.result != null;
  const letters = ['A','B','C','D'];

  const optHtml = q.opts.map((o,k)=>{
    let cls = 'opt';
    if(!done){ if(st.picked === k) cls += ' picked'; }
    else{
      if(k === q.a) cls += ' right';
      else if(st.picked === k) cls += ' wrongpick';
      else cls += ' dim';
    }
    return `<button class="${cls}" data-k="${k}" ${done?'disabled':''}><span class="key">${letters[k]}</span><span class="val">${o}</span></button>`;
  }).join('');

  let stampHtml = '', explainHtml = '';
  if(done){
    const map = {correct:['BENAR','ok'], wrong:['SALAH','bad'], timeout:['WAKTU HABIS','bad'], skip:['TERLEWAT','miss']};
    const [t,c] = map[st.result];
    stampHtml = `<div class="stamp ${c}">${t}</div>`;
    const head = st.result==='correct' ? 'Tepat sekali, ini caranya:'
               : st.result==='wrong'    ? 'Belum tepat. Bandingkan dengan ini:'
               : st.result==='timeout'  ? 'Waktu habis sebelum kamu menekan Cek Jawaban:'
               : 'Soal ini dilewati tanpa menjawab. Ini pembahasannya:';
    explainHtml = `<div class="explain ${c}"><h4><svg class="ic"><use href="#i-book"/></svg>Pembahasan — ${head}</h4><div class="exbody">${q.exp}</div></div>`;
  }

  const stLabel = {correct:'Benar', wrong:'Salah', timeout:'Waktu habis', skip:'Tidak dijawab'};
  const stLine = done
    ? `<div class="q-status ${st.result==='correct'?'ok':st.result==='wrong'?'bad':'miss'}"><svg class="ic"><use href="#i-clock"/></svg>${stLabel[st.result]} · ${fmt(st.timeUsed)}</div>`
    : `<div class="q-status" style="color:var(--ink-soft)"><svg class="ic"><use href="#i-clock"/></svg>Waktu berjalan…</div>`;

  const foot = done
    ? `<button class="btn pri" id="goNext">${qi===TOTAL-1?'Lihat Hasil Latihan':'Lanjut ke Soal Berikutnya'} <svg class="ic"><use href="#i-cr"/></svg></button>`
    : `<button class="btn acc" id="checkBtn" ${st.picked==null?'disabled':''}>Cek Jawaban</button>
       <span class="hint">Pilih satu jawaban, lalu tekan <b>Cek Jawaban</b> — waktunya akan berhenti.</span>`;

  return `<div class="slide">
    <div class="qgrid">
      <aside class="qside">
        <div class="rlabel">PUTARAN ${q.sec+1} — ${sec.short.toUpperCase()}</div>
        <div class="q-no">${String(pos).padStart(2,'0')}</div>
        <div class="q-pos">Soal ${pos} dari ${SEC_N[q.sec]}</div>
        <div class="q-tag"><svg class="ic"><use href="#i-flag"/></svg>${q.tag}</div>
        ${stLine}
      </aside>
      <div class="qcard">
        ${stampHtml}
        <div class="q-text">${q.q}</div>
        <div class="opts">${optHtml}</div>
        <div class="qfoot">${foot}</div>
        ${explainHtml}
      </div>
    </div>
  </div>`;
}

function resultHTML(){
  const R = state.qs;
  const cnt = k => R.filter(s=>s.result===k).length;
  const correct = cnt('correct'), wrong = cnt('wrong'), skipped = cnt('skip'), timeout = cnt('timeout');
  const un = skipped + timeout;
  const total = R.reduce((a,s)=>a+(s.timeUsed||0),0), avg = total/R.length;
  const pct = Math.round(correct/R.length*100);
  const per = [0,1,2].map(s=>{
    let b=0; Q.forEach((q,i)=>{ if(q.sec===s && R[i].result==='correct') b++; }); return b;
  });

  let vStamp, vCls, conclusion;
  if(pct>=85){ vStamp='MENGUASAI'; vCls='ok';
    conclusion=`Luar biasa! <b>${esc(state.name)} terbukti sudah memahami materi operasi hitung pecahan dengan sangat baik</b> — mulai dari konsep dasar, operasi campuran, sampai soal olimpiade HOTS. Siap melanjutkan ke soal olimpiade yang lebih menantang.`; }
  else if(pct>=70){ vStamp='MEMAHAMI BAIK'; vCls='ok';
    conclusion=`<b>${esc(state.name)} sudah memahami sebagian besar materi operasi hitung pecahan</b> dan berada di jalur yang benar menuju olimpiade. Perdalam jenis soal yang masih keliru di bawah ini agar makin mantap sebelum hari pertandingan.`; }
  else if(pct>=50){ vStamp='CUKUP'; vCls='mid';
    conclusion=`<b>${esc(state.name)} baru memahami sebagian materi operasi hitung pecahan</b>. Konsep dasarnya mulai terbentuk, tetapi masih goyah di beberapa jenis soal. Ulangi pembahasan soal yang salah, lalu kerjakan kembali ketiga putaran ini sebelum bertanding.`; }
  else{ vStamp='PERLU LATIHAN'; vCls='bad';
    conclusion=`Berdasarkan hasil ini, <b>${esc(state.name)} belum memahami materi operasi hitung pecahan secara utuh</b>. dampingi kembali belajarnya dari 4 slide materi (mengubah bentuk pecahan dan menyamakan penyebut), lalu ulangi latihan ini secara bertahap dari Putaran 1.`; }

  const weak = [...new Set(R.map((s,i)=> s.result!=='correct' ? Q[i].tag : null).filter(Boolean))];
  const weakHtml = weak.length
    ? `<p><b>Perlu penguatan:</b> ${weak.slice(0,6).map(t=>`<span class="pill">${t}</span>`).join(' ')}${weak.length>6?' …':''}</p>`
    : `<p><b>Tidak ada materi yang tertinggal</b> — pertahankan, dan tambah porsi soal sulit!</p>`;

  const secLine = `Per putaran: operasi pecahan <b class="mono">${per[0]}/10</b>, operasi campuran <b class="mono">${per[1]}/10</b>, olimpiade <b class="mono">${per[2]}/20</b>.`;
  const timeNote = avg<=45 ? 'Tempo pengerjaanmu sangat lancar.' : avg<=90 ? 'Tempo pengerjaanmu cukup baik.' : 'Waktu pengerjaan tergolong lama — biasakan hitung cepat dan cermat.';

  const li = (l,v,cls='') => `<li><span>${l}</span><span class="fill"></span><b class="mono ${cls}">${v}</b></li>`;
  const bars = [0,1,2].map(s=>{
    const w = Math.round(per[s]/SEC_N[s]*100), cls = w>=60?'':w>=40?'mid':'bad';
    return `<div class="sec-row"><span>${SECTIONS[s].short}</span><span class="track"><span class="fillb ${cls}" style="width:${w}%"></span></span><b class="mono">${per[s]}/${SEC_N[s]}</b></div>`;
  }).join('');
  const rec = [0,1,2].map(s=>{
    const cells = Q.map((q,i)=>({q,i})).filter(o=>o.q.sec===s).map(o=>{
      const r = R[o.i].result;
      return `<span class="cell ${r==='correct'?'c':r==='wrong'?'w':r?'s':''}" title="Soal ${o.i%10+1}"></span>`;
    }).join('');
    return `<div class="rcol"><div class="rh">P${s+1} · ${SECTIONS[s].short} (${SEC_N[s]})</div><div class="cells">${cells}</div></div>`;
  }).join('');
  const dstr = new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  return `<div class="slide"><div class="report">
    <div class="vstamp ${vCls}">${vStamp}</div>
    <div class="kick">Rapor Latihan · ${dstr} · ${TOTAL} Soal</div>
    <h2 class="rname">${esc(state.name)}</h2>
    <div class="score-row">
      <div class="big-score">${correct}<small>dari ${TOTAL} soal<br><b class="mono" style="font-size:1.2rem">${pct}%</b></small></div>
      <ul class="ledger">
        ${li('Jawaban benar', correct, 'ok')}
        ${li('Jawaban salah', wrong, 'bad')}
        ${li('Tidak dijawab', un, 'miss')}
        ${li('Rata-rata waktu per soal', fmt(avg))}
        ${li('Total waktu latihan', fmt(total))}
      </ul>
    </div>
    <div class="kick" style="margin-bottom:6px">Penguasaan per putaran</div>
    ${bars}
    <div class="analysis">
      <h4><svg class="ic"><use href="#i-book"/></svg>Analisis Hasil Belajar</h4>
      <p>${secLine}</p>
      <p>Rata-rata waktu pengerjaan <b class="mono">${fmt(avg)}</b> per soal. ${timeNote}${timeout?` <b>${timeout} soal</b> kehabisan waktu.`:''}${skipped?` <b>${skipped} soal</b> dilewati tanpa menjawab.`:''}</p>
      <p>${conclusion}</p>
      ${weakHtml}
    </div>
    <div class="recapwrap">
      <div class="rh2">Rekap ${TOTAL} Soal</div>
      <div class="recap">${rec}</div>
      <div class="legend"><span><i class="sw c"></i>Benar</span><span><i class="sw w"></i>Salah</span><span><i class="sw s"></i>Tidak dijawab</span></div>
    </div>
    <div class="rbtns"><button class="btn pri big" id="retryBtn"><svg class="ic"><use href="#i-rt"/></svg> Ulangi Latihan</button></div>
  </div></div>`;
}

/* =========================================================
   RENDER & TOPBAR
========================================================= */
function updateTopbar(){
  $('#stName').textContent = state.name || '—';
  $('#navWrap').classList.toggle('hide', state.idx===0);
  $('#prevBtn').disabled = state.idx===0;
  $('#nextBtn').disabled = state.idx>=LAST;

  const qi = slideToQ(state.idx);
  $('#nextLbl').textContent = (qi===TOTAL-1 && state.qs[TOTAL-1].result) ? 'Hasil' : 'Lanjut';

  $('#dots').innerHTML = Q.map((q,i)=>{
    const r = state.qs[i].result;
    let c = r==='correct'?'c':r==='wrong'?'w':r?'s':'';
    if(i===qi && !c) c = 'cur';
    return `<span class="dot ${c}" data-q="${i}" title="Soal ${i+1}"></span>`;
  }).join('');

  const tb = $('#timerBox');
  if(qi == null){ $('#timeTxt').textContent='3:00'; $('#ring').style.strokeDashoffset=0; tb.className='idle'; }
  else if(state.qs[qi].result != null){ $('#timeTxt').textContent=fmt(state.qs[qi].timeUsed); $('#ring').style.strokeDashoffset=0; tb.className='done'; }
  else { $('#timeTxt').textContent=fmt(DUR); $('#ring').style.strokeDashoffset=0; tb.className=''; }
  tb.classList.remove('low');
}

function render(){
  updateTopbar();
  const stage = $('#stage'), i = state.idx;
  if(i===0) stage.innerHTML = coverHTML();
  else if(i>=1&&i<=4) stage.innerHTML = materiHTML(i);
  else if(i===5||i===16||i===27) stage.innerHTML = dividerHTML(i);
  else if(i===LAST) stage.innerHTML = resultHTML();
  else stage.innerHTML = questionHTML(slideToQ(i));

  if(i===0){
    const start = ()=>{
      const v = $('#nameInput').value.trim();
      if(!v){
        $('#nameErr').textContent = 'Isi dulu namamu, ya!';
        $('#nameInput').classList.add('shake');
        setTimeout(()=>$('#nameInput').classList.remove('shake'),450);
        return;
      }
      state.name = v; go(1);
    };
    $('#startBtn').onclick = start;
    $('#nameInput').onkeydown = e => { if(e.key==='Enter') start(); };
    $('#nameInput').oninput = () => $('#nameErr').textContent = '';
  }
  else if(i>=1&&i<=4) $('#bekalBtn').onclick = next;
  else if(i===5||i===16||i===27) $('#goSec').onclick = next;
  else if(i===LAST) $('#retryBtn').onclick = ()=>{ const nm=state.name; state=freshState(); state.name=nm; render(); };
  else{
    const qi = slideToQ(i);
    stage.querySelectorAll('.opt').forEach(b => b.onclick = ()=>onPick(qi, +b.dataset.k, b));
    const cb = $('#checkBtn'); if(cb) cb.onclick = ()=>finalize(qi,'check');
    const gn = $('#goNext');   if(gn) gn.onclick = next;
    if(state.qs[qi].result == null) startTimer();
  }
}

/* =========================================================
   EVENT GLOBAL
========================================================= */
 $('#addBtn').onclick = ()=>{
  if(!timer.int) return;
  timer.deadline += 15000;
  const p = document.createElement('span');
  p.className = 'p15'; p.textContent = '+15 dtk';
  $('#timerWrap').appendChild(p);
  setTimeout(()=>p.remove(), 950);
  tick();
};
 $('#prevBtn').onclick = prev;
 $('#nextBtn').onclick = next;
 $('#dots').addEventListener('click', e=>{
  const d = e.target.closest('.dot');
  if(!d) return;
  const qi = +d.dataset.q;
  if(state.qs[qi].result != null) go(qToSlide(qi));
});
document.addEventListener('keydown', e=>{
  if(state.idx===0) return;
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight' && !$('#nextBtn').disabled) next();
  if(e.key==='ArrowLeft'  && !$('#prevBtn').disabled) prev();
});

render();
</script>
</body>
</html>
